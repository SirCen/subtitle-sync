name: Release plugin

# Tagging `MAJOR.MINOR.PATCH.REVISION` publishes the Jellyfin plugin:
#
#   tag -> build x2 -> zip x2 -> GitHub Release -> entries in public/jellyfin/manifest.json -> main
#
# Every tag ships TWO builds of the same source, one per Jellyfin server line:
# net9.0 against the 10.11 packages and net10.0 against the 12 ones (see
# jellyfin-plugin/Directory.Build.props). Each gets its own zip and its own
# manifest entry, distinguished only by targetAbi.
#
# The manifest is the file users point Jellyfin at. It is served from
# https://subtitlesync.sircen.dev/jellyfin/manifest.json and, as a fallback, from
# raw.githubusercontent.com. One file, two URLs, no runtime dependency.
on:
  push:
    tags:
      # Bare four-part versions only - no `v` prefix, no `-rc1` suffix. Jellyfin
      # parses every version it sees with System.Version, so the tag, the
      # assembly, the in-zip meta.json and the repository manifest are all
      # spelled identically and nothing has to be translated between them.
      #
      # This is a glob, not a regex: `*` here means "any characters", so it
      # matches 1.0.0.0 and rejects v1.0.0.0. The step below re-checks the shape
      # properly, because the glob alone would also admit 1.0.0.0-rc1.
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"

# Enough to create a release and to push the manifest commit back to main.
permissions:
  contents: write

# Never run two releases at once: they would race on the manifest commit. Do not
# cancel an in-progress one either, or a half-published release could be left
# with an asset and no manifest entry.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PLUGIN_CSPROJ: jellyfin-plugin/Jellyfin.Plugin.SubtitleSync/Jellyfin.Plugin.SubtitleSync.csproj
  PLUGIN_ASSEMBLY: Jellyfin.Plugin.SubtitleSync.dll
  PLUGIN_GUID: 96d55013-3cf0-465e-9036-7fb73dd47f71
  PLUGIN_NAME: Subtitle Sync
  # One line per build: target framework, targetAbi, zip suffix. Keep the
  # framework/ABI pairs in step with jellyfin-plugin/Directory.Build.props, which
  # compiles each framework against the OLDEST server its targetAbi admits.
  #
  # targetAbi is a minimum, not an exact match: InstallationManager filters with
  # `Version.Parse(x.TargetAbi) <= appVer` and applies no upper bound (research
  # doc, section 13; unchanged at v12.1). So a 10.11 server is offered only the
  # 10.11 build, and a 12 server is offered both. Among entries with the same
  # plugin version it then takes the FIRST one in the manifest - the sort is a
  # stable OrderByDescending on the version alone - which is why the newest ABI
  # is listed, and therefore written, first.
  BUILDS: |
    net10.0 12.0.0.0 jellyfin-12
    net9.0 10.11.0.0 jellyfin-10.11
  MANIFEST_PATH: public/jellyfin/manifest.json

jobs:
  release:
    name: build, publish, manifest
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # The 10 SDK is what matters: it compiles both the net9.0 (Jellyfin
          # 10.11) and the net10.0 (Jellyfin 12) build. 9.0.x is kept so this
          # job has the same toolchain as the CI job that tested the commit.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Set up Node
        # Not optional: `dotnet publish` below invokes node to build the esbuild
        # bundle of lib/ that the assembly embeds (#10).
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm install` (not `npm ci`) for the same reason as ci.yml: the
        # lockfile is generated on Windows and omits Linux-only optional deps.
        run: npm install --no-audit --no-fund

      - name: Derive the version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Exactly four numeric parts, nothing before and nothing after. The
          # tag IS the plugin version - it is copied verbatim into meta.json and
          # into the repository manifest, and a `v` prefix or an `-rc1` suffix
          # would make System.Version.Parse throw on the server, which surfaces
          # as the plugin simply never appearing in the catalogue.
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not MAJOR.MINOR.PATCH.REVISION. Jellyfin versions take exactly four numeric parts with no prefix or suffix."
            exit 1
          fi
          version="$tag"

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version from tag $tag"

      - name: Check the csproj version matches the tag
        # The csproj is the source of truth for the assembly; the tag ratifies a
        # version that was already committed. Tagging without bumping the csproj
        # fails here rather than shipping a manifest that claims a version the
        # DLL does not carry.
        run: |
          set -euo pipefail
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PLUGIN_CSPROJ" | head -n1)
          if [[ -z "$declared" ]]; then
            echo "::error::No <Version> element in $PLUGIN_CSPROJ."
            exit 1
          fi
          # The tag must be four-part, but MSBuild is happy with a 3-part
          # <Version> and expands it to X.Y.Z.0 in the assembly, so accept that
          # spelling here rather than failing a release over a missing `.0`.
          if [[ "$declared" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            declared="$declared.0"
          fi
          if [[ "$declared" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Tag says ${{ steps.version.outputs.version }} but $PLUGIN_CSPROJ declares $declared. Bump the csproj and re-tag."
            exit 1
          fi
          echo "csproj declares $declared"

      - name: Publish the plugin
        # The csproj's BuildWebBundle target shells out to node to run esbuild
        # over lib/ and embeds the result (#10), so this needs Node and a
        # populated node_modules - both set up above. Never pass
        # -p:SkipWebBundle=true here: it would ship a stale or missing bundle.
        #
        # One publish per framework, into publish/<tfm>/. `dotnet publish` on a
        # multi-targeted project refuses to run without -f.
        run: |
          set -euo pipefail
          while read -r tfm abi label; do
            [[ -z "$tfm" ]] && continue
            echo "--- $tfm (Jellyfin $abi)"
            dotnet publish "$PLUGIN_CSPROJ" -c Release -f "$tfm" -o "publish/$tfm" --nologo
          done <<< "$BUILDS"

      - name: Check the built assembly version matches the tag
        # Second, independent check: on the artefact rather than on the source.
        # Catches a Directory.Build.props or an MSBuild override rewriting the
        # version behind the csproj's back.
        shell: pwsh
        run: |
          $expected = '${{ steps.version.outputs.version }}'
          foreach ($dir in Get-ChildItem 'publish' -Directory) {
            $dll = Join-Path $dir.FullName $env:PLUGIN_ASSEMBLY
            $actual = [System.Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString()
            if ($actual -ne $expected) {
              Write-Output "::error::$($dir.Name)/$env:PLUGIN_ASSEMBLY has AssemblyVersion $actual, tag says $expected."
              exit 1
            }
            Write-Output "$($dir.Name)/$env:PLUGIN_ASSEMBLY carries AssemblyVersion $actual"
          }

      - name: Assemble the install zips
        id: package
        # Jellyfin extracts the zip straight into
        # `plugins/<name>_<version>/` with ZipFile.ExtractToDirectory, so the
        # payload must sit at the zip root with no wrapping directory.
        #
        # Assemblies only: the .pdb and the XML doc file are build by-products,
        # and the server's own assemblies are already excluded by
        # ExcludeAssets=runtime in the csproj.
        #
        # One zip per line of BUILDS. Each is recorded in builds.tsv as
        # `targetAbi <TAB> zip <TAB> md5`, in BUILDS order, for the upload, the
        # verification and the manifest steps below.
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          builds_file="$RUNNER_TEMP/builds.tsv"
          : > "$builds_file"

          # Changelog: the annotated tag's message if there is one, otherwise a
          # bare line. Shown in Dashboard > Plugins next to the version.
          #
          # Re-fetch the tag first. actions/checkout resolves the ref to a
          # commit and leaves a LIGHTWEIGHT tag behind, and %(contents:subject)
          # on a lightweight tag falls through to the commit's subject with no
          # error - so without this the changelog silently becomes whatever the
          # last commit message happened to be. Observed on 1.0.0.0.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          # `git tag -l` cannot tell the two apart, but cat-file can.
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" == "tag" ]]; then
            changelog=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          else
            changelog=""
          fi
          if [[ -z "$changelog" ]]; then
            changelog="Release $version"
          fi
          echo "Changelog: $changelog"

          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          while read -r tfm target_abi label; do
            [[ -z "$tfm" ]] && continue
            zip_name="subtitle-sync_${version}_${label}.zip"

            if [[ ! -f "publish/$tfm/$PLUGIN_ASSEMBLY" ]]; then
              echo "::error::publish/$tfm/$PLUGIN_ASSEMBLY is missing."
              exit 1
            fi

            rm -rf stage && mkdir stage
            cp "publish/$tfm/"*.dll stage/

            # In-zip meta.json: MediaBrowser.Common.Plugins.PluginManifest. A
            # different schema from the repository manifest. The server rewrites
            # it on install, but it is what a manual zip drop reads.
            assemblies=$(cd stage && ls *.dll | jq -R . | jq -sc .)
            jq -n \
              --arg category "Subtitles" \
              --arg changelog "$changelog" \
              --arg description "Re-time subtitle tracks against the audio they belong to." \
              --arg guid "$PLUGIN_GUID" \
              --arg name "$PLUGIN_NAME" \
              --arg overview "Re-time subtitle tracks against the audio they belong to." \
              --arg owner "SirCen" \
              --arg targetAbi "$target_abi" \
              --arg timestamp "$timestamp" \
              --arg version "$version" \
              --argjson assemblies "$assemblies" \
              '{category: $category, changelog: $changelog, description: $description,
                guid: $guid, name: $name, overview: $overview, owner: $owner,
                targetAbi: $targetAbi, timestamp: $timestamp, version: $version,
                status: "Active", autoUpdate: true, assemblies: $assemblies}' \
              > stage/meta.json

            rm -f "$zip_name"
            (cd stage && zip -qr "../$zip_name" .)

            checksum=$(md5sum "$zip_name" | cut -d' ' -f1)
            printf '%s\t%s\t%s\n' "$target_abi" "$zip_name" "$checksum" >> "$builds_file"

            echo "$zip_name (targetAbi $target_abi)  md5 $checksum"
            unzip -l "$zip_name"
          done <<< "$BUILDS"

          {
            echo "timestamp=$timestamp"
            echo "changelog=$changelog"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          mapfile -t zips < <(cut -f2 "$RUNNER_TEMP/builds.tsv")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${zips[@]}" --clobber
          else
            gh release create "$tag" "${zips[@]}" \
              --title "$tag" \
              --generate-notes
          fi

      - name: Verify the published assets
        # The manifest is about to promise these bytes at these URLs. Fetch each
        # back over the public URL and re-check the MD5 before making that
        # promise.
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
          while IFS=$'\t' read -r target_abi zip_name expected; do
            url="$base/$zip_name"
            rm -f downloaded.zip
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 3 -o downloaded.zip "$url"; then
                break
              fi
              echo "Asset not servable yet (attempt $attempt), waiting."
              sleep 5
            done
            actual=$(md5sum downloaded.zip | cut -d' ' -f1)
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$url serves md5 $actual, expected $expected."
              exit 1
            fi
            echo "$url verified (targetAbi $target_abi)"
          done < "$RUNNER_TEMP/builds.tsv"

      - name: Check out main for the manifest commit
        uses: actions/checkout@v5
        with:
          ref: main
          path: main
          # Full history: the update loop below re-fetches and hard-resets to
          # origin/main on each attempt, which a shallow clone makes fragile.
          fetch-depth: 0
          # Clone over SSH as a deploy key rather than as GITHUB_TOKEN, because
          # the push below has to get past the branch ruleset on main and
          # GITHUB_TOKEN cannot: it authenticates as the github-actions bot,
          # which is not a bypass actor and cannot be made one on a personal
          # repository (the Integration actor type is org-only). A deploy key
          # can be, and is - see `DeployKey` in the ruleset's bypass_actors.
          #
          # The key is write-scoped to this repository alone and carries no
          # account permissions, which is the point: a PAT with enough rights
          # to push here would also carry every other right the owner has.
          ssh-key: ${{ secrets.MANIFEST_DEPLOY_KEY }}

      - name: Add the version to the repository manifest
        # Safety of this step:
        #
        # * Concurrent pushes. Each attempt resets hard to freshly fetched
        #   origin/main and regenerates the entry from scratch, so there is
        #   never a merge or a rebase to conflict. Last writer wins on a file
        #   nobody else edits by hand.
        # * Recursion. This pushes as a deploy key, NOT as GITHUB_TOKEN, so the
        #   usual "pushes from Actions do not trigger workflows" guarantee does
        #   not apply and `[skip ci]` below is load-bearing rather than belt and
        #   braces. It stops the manifest commit from starting a CI run over a
        #   one-file JSON change. Release itself is safe either way: it triggers
        #   on tags only, and this pushes a branch.
        # * Idempotence. Re-running the same tag rewrites that version's entries
        #   in place and exits cleanly if nothing changed.
        #
        # main is ruleset-protected against direct pushes, which is why the
        # checkout above authenticates as a deploy key: that key is a bypass
        # actor. There is no PR-based alternative that keeps the manifest in
        # step with the release rather than lagging behind a human merge.
        working-directory: main
        env:
          # Via env, not inline `${{ }}`: the changelog comes from a tag message
          # and must never be spliced into the shell.
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.package.outputs.changelog }}
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
          SOURCE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/update-manifest.mjs" <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const [path, buildsFile] = process.argv.slice(2);
          const { VERSION: version, CHANGELOG: changelog, TIMESTAMP: timestamp, SOURCE_BASE: sourceBase } =
            process.env;

          const manifest = JSON.parse(readFileSync(path, "utf8"));
          const guid = process.env.PLUGIN_GUID.toLowerCase();
          const pkg = manifest.find((p) => p.guid.toLowerCase() === guid);
          if (!pkg) {
            throw new Error(`No package with guid ${guid} in ${path}`);
          }

          // One entry per build, in BUILDS order - newest ABI first, because a
          // server that admits several entries of one version installs the
          // first. See the BUILDS comment at the top of this workflow.
          const entries = readFileSync(buildsFile, "utf8")
            .split("\n")
            .filter(Boolean)
            .map((line) => {
              const [targetAbi, zip, checksum] = line.split("\t");
              return { version, changelog, targetAbi, sourceUrl: `${sourceBase}/${zip}`, checksum, timestamp };
            });
          if (entries.length === 0) {
            throw new Error(`No builds listed in ${buildsFile}`);
          }

          // Newest first, and re-running a tag replaces rather than duplicates.
          pkg.versions = [...entries, ...pkg.versions.filter((v) => v.version !== version)];

          writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node "$RUNNER_TEMP/update-manifest.mjs" "$MANIFEST_PATH" "$RUNNER_TEMP/builds.tsv"

            if git diff --quiet -- "$MANIFEST_PATH"; then
              echo "$MANIFEST_PATH already lists $VERSION; nothing to push."
              exit 0
            fi

            git add "$MANIFEST_PATH"
            git commit -m "Publish plugin $VERSION to the Jellyfin repository manifest [skip ci]"

            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected, main moved. Retrying."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the manifest update to main after 5 attempts."
          exit 1
